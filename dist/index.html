pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function extractPdfText(file) {

        // a row if they're within a small Y tolerance of each other. The previous version
        // grouped by Math.round(y) exactly - but different columns in a table (numbers vs
        // text) can render at slightly different sub-pixel Y positions, so an exact-integer
        // group could split one real row into two fragments, neither of which matches the
        // parser regex on its own - silently dropping whole rows with no error or flag.
        // Confirmed and fixed on Darien first (it was dropping Modelo, Coors Light, and
        // other high-volume beer rows).
        const items = content.items.map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }))
            .sort((a, b) => (b.y - a.y) || (a.x - b.x));
        const Y_TOLERANCE = 2.5;
        const rows = [];
        for (const it of items) {
            let row = rows.find(r => Math.abs(r.y - it.y) <= Y_TOLERANCE);
            if (!row) { row = { y: it.y, items: [] }; rows.push(row); }

    {
        const beerMaster = getMaster().filter(m => m.category === "Beer");
        const bucketByProduct = {};
        bucket.forEach(r => {
            if (r.name === "Bud Light") return; // already handled above, don't double-count
            // Step 1: PLU match - the reliable path, no spelling variants possible.
            let matchedProduct = BUCKET_PLU_MAP[r.plu];
            // Step 2: normalized name match - fallback for beers not yet in BUCKET_PLU_MAP.
            // Checks the alias table first (for genuinely different names, not just spacing),
            // then falls back to normalized comparison against every Beer product in Master.
            if (!matchedProduct) {
                const fixedName = BUCKET_NAME_ALIASES[r.name] || r.name;
                const normalizedTarget = normalizeBeerName(fixedName);
                const match = beerMaster.find(m => normalizeBeerName(m.product) === normalizedTarget);
                if (match) matchedProduct = match.product;
            }
            if (matchedProduct) {
                bucketByProduct[matchedProduct] = (bucketByProduct[matchedProduct] || 0) + r.qty;
            } else {
                // Step 3: neither PLU nor normalized name matched anything - flag it loudly
                // instead of silently dropping the sale, same failsafe pattern as carryout.
                results.flags.push(`Bucket Bottles report has PLU ${r.plu} ("${r.name}", qty ${r.qty}) which doesn't match any known Beer product - this sale is being dropped from sold totals. Add it to BUCKET_PLU_MAP.`);
            }
        });
        Object.entries(bucketByProduct).forEach(([product, qty]) => {
            results.bottles[product] = (results.bottles[product] || 0) + qty;
        });
    }
    // Other carryout beers (6-pack)
    for (const r of carryout) {
        const item = CARRYOUT_BEER_PLU[r.plu];
        if (item) results.bottles[item] = (results.bottles[item] || 0) + r.qty * 6;
    }
    // Carryout wine (1 bottle each)
    for (const r of carryout) {
        const item = CARRYOUT_WINE_PLU[r.plu];
        if (item) {
            if (!results._carryoutWine) results._carryoutWine = {};
            results._carryoutWine[item] = (results._carryoutWine[item] || 0) + r.qty;
        }
    }
    // Carryout other items
    for (const r of carryout) {
        const mapping = CARRYOUT_OTHER_PLU[r.plu];
        if (mapping) results.bottles[mapping.item] = (results.bottles[mapping.item] || 0) + r.qty * mapping.mult;
    }
    // Failsafe: any carryout PLU not matched by any of the three maps above gets checked
    // against Master by name. If the raw report name looks like it's really one of your
    // tracked products, that's a loud red flag instead of a silent drop - this is exactly
    // the gap that let Whitehaven Sauv Blanc's carryout sales vanish unnoticed for who
    // knows how long: the PLU just was never added to CARRYOUT_WINE_PLU, and nothing ever
    // said so.
    {
        const masterList = getMaster();
        const matchedPlus = new Set([...Object.keys(CARRYOUT_BEER_PLU), ...Object.keys(CARRYOUT_WINE_PLU), ...Object.keys(CARRYOUT_OTHER_PLU)]);
        for (const r of carryout) {
            if (matchedPlus.has(r.plu)) continue;
            // Bud Light's carryout sale is tracked separately via a direct name match
            // (see budCarryout above), not through the standard PLU dictionaries - without
            // this exclusion the failsafe below would falsely flag it as unmapped even
            // though it's already being counted correctly.
            if (r.name && r.name.toLowerCase() === "budlight") continue;
            const rawName = (r.name || "").toLowerCase().trim();
            if (!rawName) continue;
            const match = masterList.find(m => {
                const mn = m.product.toLowerCase();
                return mn === rawName || mn.includes(rawName) || rawName.includes(mn.split(" ")[0]);
            });
            if (match) {
                results.flags.push(`CARRYOUT PLU ${r.plu} ("${r.name}", qty ${r.qty}) is NOT mapped anywhere for carryout tracking, but looks like it's really "${match.product}" - this sale is being silently dropped from sold totals. Add PLU ${r.plu} to the carryout map for "${match.product}".`);
            }
        }
    }

    const hnTotal = highnoon.reduce((s, r) => s + r.qty, 0);
    const hnGeneric = beer.find(r => r.plu === "2910");
    // High Noon mismatch suppressed - caused by unrecorded flavor modifier at register, not a data error
    const flavorMap = { "Peach": "High Noon Peach", "Pineapple": "High Noon Pineapple", "Watermelon": "High Noon Watermelon" };
    for (const r of highnoon) {
        const item = flavorMap[r.name];
        if (item) results.bottles[item] = (results.bottles[item] || 0) + r.qty;
    }

    // Vodkade discontinued per Ely's instruction - PLU 3473 (generic "Vodkade" line on the
    // Beer Report) is intentionally left unhandled now, so it's simply ignored rather than
    // silently recreating a product that's supposed to be gone for good.
    results._vodkadeOrangeFallback = 0;

    return results;
}

function parseLiquorReport(text) {

const WINE_INFERRED = new Set(); // All house-pour brands confirmed as Canyon Road
const WINE_COCKTAIL_PLUS = new Set(["2876", "2877"]); // Red/White Sangria routed through recipe engine
const WINE_SUPPRESS = new Set(["3367", "2874", "2879", "2876", "2877"]); // Terrazaz discontinued
// Lamarca Splitz is a single-serve mini-bottle (187ml), rung up at the register as a
// "Glass" for convenience, and it's already correctly tagged sold_as: "Unit" in Master -
// but this parser never checked that tag, and ran it through the standard glass-to-bottle
// oz ratio anyway (built for a 750ml bottle poured into ~5oz glasses). That math is wrong
// for a product that's never actually poured from anything - every sale is one whole
// unit. This exact bug was confirmed and fixed on Darien's app first; this closed roughly
// 80%+ of what had been an unexplained variance on Lamarca Splitz specifically.
const WINE_UNIT_SOLD = new Set(["Lamarca Splitz"]);
function parseWineReport(text) {
    const rows = parseSizesSoldWine(text);
    const ozByItem = {};
    const unitByItem = {};
    const flags = [];
    const alreadyFlagged = new Set();
    for (const r of rows) {
        if (WINE_SUPPRESS.has(r.plu)) { continue; }
        if (WINE_COCKTAIL_PLUS.has(r.plu)) { if (!alreadyFlagged.has(r.plu)) { flags.push(`PLU ${r.plu} "${r.name}" - specialty cocktail, not a direct wine item`); alreadyFlagged.add(r.plu); } continue; }
        const item = WINE_PLU_MAP[r.plu];
        if (!item) { if (!alreadyFlagged.has(r.plu)) { flags.push(`Unmapped Wine PLU ${r.plu} (${r.name}, qty ${r.qty})`); alreadyFlagged.add(r.plu); } continue; }
        if (WINE_INFERRED.has(r.plu) && !alreadyFlagged.has(r.plu)) { flags.push(`PLU ${r.plu} "${r.name}" -> assumed "${item}" (inferred house-pour brand, not confirmed)`); alreadyFlagged.add(r.plu); }
        if (WINE_UNIT_SOLD.has(item)) { unitByItem[item] = (unitByItem[item] || 0) + r.qty; continue; }
        const oz = r.size === "Bottle" ? r.qty * 25.4 : (r.qty / WINE_GLASSES_PER_BOTTLE) * 25.4;
        ozByItem[item] = (ozByItem[item] || 0) + oz;
    }
    const bottles = {};
    for (const [item, oz] of Object.entries(ozByItem)) bottles[item] = Math.round((oz / 25.4) * 100) / 100;
    for (const [item, qty] of Object.entries(unitByItem)) bottles[item] = qty;
    return { bottles, flags };
}

const SPECIALTY_STRAIGHT_POUR = {
    "Baileys": { ingredient: "Bailey's", oz: 1.5 },
    "Disaronno": { ingredient: "Disaronno", oz: 1.5 },
    "E&J Brandy": { ingredient: "E&J", oz: 1.5 },

    "Jack Honey": { ingredient: "Jack Daniels Honey", oz: 1.5 }, "Kahlua": { ingredient: "Kahlua", oz: 1.5 }, "Sambuca": { ingredient: "Sambuca", oz: 1.5 }, "Sambucca": { ingredient: "Sambuca", oz: 1.5 }, "Kahlúa": { ingredient: "Kahlua", oz: 1.5 },
    "Rumpleminze": { ingredient: "Rumple Minze", oz: 1.5 },
};
const SPECIALTY_NO_RECIPE = new Set(); // All drinks now have recipes or aliases
async function parseSpecialtyReport(text, recipeRows, soldAsMap) {
    const rows = parseSalesByItemLines(text);
    const recipeMap = {};
    for (const r of recipeRows) {
        if (r.tracked !== "Yes") continue;
        if (!recipeMap[r.drink]) recipeMap[r.drink] = [];
        recipeMap[r.drink].push({ ingredient: r.maps_to_master_item, oz: r.oz });
    }
    const unitDepletion = {}, ozByItem = {}, flags = [];
    function addDepletion(ingredient, amount) {
        if (soldAsMap[ingredient] === "Unit") unitDepletion[ingredient] = (unitDepletion[ingredient] || 0) + amount;
        else ozByItem[ingredient] = (ozByItem[ingredient] || 0) + amount;
    }
    for (const row of rows) {
        if (SPECIALTY_NO_RECIPE.has(row.name)) { flags.push(`"${row.name}" sold ${row.qty}x - NO RECIPE on file`); continue; }
        if (SPECIALTY_STRAIGHT_POUR[row.name]) {
            const { ingredient, oz } = SPECIALTY_STRAIGHT_POUR[row.name];
            addDepletion(ingredient, oz * row.qty);
            continue;
        }
        const drinkName = SPECIALTY_NAME_FIX[row.name] || row.name;
        const recipe = recipeMap[drinkName];
        if (!recipe) { flags.push(`No recipe found for "${row.name}"`); continue; }
        for (const ing of recipe) addDepletion(ing.ingredient, ing.oz * row.qty);
    }
    const bottles = {};
    for (const [item, oz] of Object.entries(ozByItem)) bottles[item] = Math.round((oz / 33.81) * 100) / 100;
    return { bottles, units: unitDepletion, flags };
}

function parseVodkadeModifiers(text) {
    const rows = parseModifierLines(text);
    const bottles = {}, flags = [];
    for (const r of rows) {
        const item = VODKADE_PLU_MAP[r.plu];
        if (!item) { flags.push(`Unrecognized Vodkade modifier PLU ${r.plu}`); continue; }
        bottles[item] = (bottles[item] || 0) + r.qty;
    }
    return { bottles, flags };
}

// ─── SALES REPORTS UPLOAD SCREEN ─────────────────────────────────────────────
function detectReportType(text) {
    if (/Category:\s*Beer\b/i.test(text)) return "beer";
    if (/Category:\s*Bucket Bottles/i.test(text)) {
        // Speedline uses "Category: Bucket Bottles" for THREE genuinely different real
        // reports: the regular domestic beer bucket (Bud Light/Coors Light/Miller Lite,
        // PLUs in the 2945-2987 range, no single-flavor filter header), the real Vodkade
        // S.F. bucket (single-flavor filtered, PLU 3494/3495/3496/3497), and the regular
        // (non-S.F.) Vodkade bucket (single-flavor filtered, PLU 3475/3476). Previously
        // this always returned "vodkade_sf_bucket" regardless, which silently misfiled
        // domestic beer bucket sales as Vodkade S.F. sales, and regular Vodkade sales as
        // Vodkade S.F. sales too - both go through the wrong PLU map entirely.
        const plu = (text.match(/PLU:\s*(\d{4,5})/i) || [])[1];
        if (plu === "3494" || plu === "3495" || plu === "3496" || plu === "3497") return "vodkade_sf_bucket";
        if (plu === "3475" || plu === "3476") return "vodkade";
        return "bucket";
    }
    if (/Category:\s*Bucket/i.test(text)) return "bucket";
    if (/Category:\s*Carryout/i.test(text)) return "carryout";
    if (/Category:\s*Liquor/i.test(text)) return "liquor";
    if (/Category:\s*Wine/i.test(text)) return "wine";
    if (/Category:\s*High Noon/i.test(text)) {
        // Vodkade modifiers are filed under High Noon category in Speedline
        if (/PLU:\s*347[4-6]/i.test(text)) return "vodkade";
        return "highnoon";
    }
    if (/Category:\s*Vodkade/i.test(text) || /Vodkade SF/i.test(text)) return "vodkade";
    if (/Category:\s*Specialty/i.test(text)) return "specialty";
    return null;
}

    liquor: "Liquor Sizes Sold", wine: "Wine Sizes Sold", highnoon: "High Noon Modifier",

function SalesUploadScreen({ onBack, onSaved, orders, setOrders }) {
    const [detected, setDetected] = useState({});
    const [parsing, setParsing] = useState(false);
    const [results, setResults] = useState(null);
    const [error, setError] = useState(null);
    const [saving, setSaving] = useState(false);
    const [saved, setSaved] = useState(false);
    const fileInputRef = React.useRef(null);
    // Sales no longer patch onto an existing archive after the fact. Parsed Speedline
    // sales now write into the CURRENT week's orders.sold field, the same way Received
    // already works. Close Week then picks up sold/received/counts together and
    // calculates Depletion + Variance in one step at close time. This removes the need
    // to guess "which archive is this week" entirely.

    const handleFiles = async (e) => {
        const fileList = Array.from(e.target.files);
        const found = {};
        const unrecognized = [];
        for (const file of fileList) {
            const text = await extractPdfText(file);
            const type = detectReportType(text);
            // Previously this line overwrote any earlier file already detected as this
            // same category - if a report category spans more than one file, only the
            // last one survived and everything else was silently dropped, with no error.
            // Confirmed and fixed on Darien first (it was dropping beer sales data).
            if (type) {
                if (found[type]) {
                    found[type] = { file, text: found[type].text + "\n" + text, name: found[type].name + " + " + file.name };
                } else {
                    found[type] = { file, text, name: file.name };
                }
            }
            else unrecognized.push(file.name);
        }
        setDetected(found);
        if (unrecognized.length > 0) setError(`Could not identify: ${unrecognized.join(", ")}`);
        else setError(null);
    };

    const runParse = async () => {
        setParsing(true);
        setError(null);
        try {
            const texts = {};
            for (const [key, val] of Object.entries(detected)) texts[key] = val.text;
            const allFlags = [];
            const combinedBottles = {};
            const combinedKegs = {};
            const combinedUnits = {};

            let beerResult = null;
            if (texts.beer) {
                beerResult = parseBeerReport(texts.beer, texts.bucket, texts.carryout, texts.highnoon, texts.vodkade);
                Object.assign(combinedBottles, beerResult.bottles);
                Object.assign(combinedKegs, beerResult.kegs);
                allFlags.push(...beerResult.flags);
            }
            if (texts.liquor) {
                const r = parseLiquorReport(texts.liquor);
                Object.assign(combinedBottles, r.bottles);
                allFlags.push(...r.flags);
            }
            if (texts.wine) {
                const r = parseWineReport(texts.wine);
                Object.assign(combinedBottles, r.bottles);
                allFlags.push(...r.flags);
            }
            if (texts.vodkade) {
                const r = parseVodkadeModifiers(texts.vodkade);
                Object.assign(combinedBottles, r.bottles);
                allFlags.push(...r.flags);
            }
            if (texts.vodkade_sf_bucket) {
                const rows = parseModifierLines(texts.vodkade_sf_bucket);
                for (const r of rows) {
                    const item = VODKADE_SF_BUCKET_PLU_MAP[r.plu];
                    if (item) combinedBottles[item] = (combinedBottles[item] || 0) + r.qty;
                    else allFlags.push("Unrecognized Vodkade SF Bucket PLU " + r.plu + " qty " + r.qty);
                }
            }
            // Bug fix (found during the Jun17-Jul21 historical re-parse): carryout wine
            // bottles were parsed into beerResult._carryoutWine but never actually added
            // to combinedBottles anywhere - every carryout Canyon Road/Josh/Santa
            // Margherita/Decoy/Franciscan bottle was silently dropped from "sold" every
            // week. These share the exact same product name as the bar-poured version, so
            // they ADD on top of whatever the wine report already produced, not overwrite.
            if (beerResult && beerResult._carryoutWine) {
                for (const [item, qty] of Object.entries(beerResult._carryoutWine)) {
                    combinedBottles[item] = (combinedBottles[item] || 0) + qty;
                }
            }
            // Bug fix: previously the Vodkade Orange fallback (generic PLU 3473 from the
            // beer report) was skipped any time ANY vodkade flavor report was uploaded,
            // even if that report only covered Red/Blue and never actually captured
            // Orange - silently dropping Orange sales for that week. Now it only fills in
            // if Orange is still missing after the real flavor/SF reports were parsed.
            if (beerResult && beerResult._vodkadeOrangeFallback && !("Vodkade Orange" in combinedBottles)) {
                combinedBottles["Vodkade Orange"] = beerResult._vodkadeOrangeFallback;
            }
            if (texts.specialty) {
                const recipeRows = await sbGet("recipe_database", "select=*");
                const masterRows = await sbGet("master", "select=product,sold_as");
                const soldAsMap = {};
                masterRows.forEach(m => soldAsMap[m.product] = m.sold_as);
                const r = await parseSpecialtyReport(texts.specialty, recipeRows, soldAsMap);
                for (const [item, oz] of Object.entries(r.bottles)) combinedBottles[item] = (combinedBottles[item] || 0) + oz;
                Object.assign(combinedUnits, r.units);
                allFlags.push(...r.flags);
            }
            setResults({ bottles: combinedBottles, kegs: combinedKegs, units: combinedUnits, flags: allFlags });
        } catch (e) {
            setError("Parse error: " + e.message);
        }
        setParsing(false);
    };

    const detectedKeys = Object.keys(detected);
    return React.createElement("div", { style: { display: "flex", flexDirection: "column", height: "100vh", background: "#EFEFEF" } },
        React.createElement("header", { className: "H no-print" },
            React.createElement("div", { className: "H-logo" }, "Zazzo's"),
